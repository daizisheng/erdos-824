name: Palomar full preflight

on:
  push:
    branches: [main, palomar-adaptation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Identify this preflight
        id: request
        run: echo "request_id=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

  verify:
    needs: identity
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.identity.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"project_path":"lean","comparator_config_path":"lean/comparator.json","formalization_metadata_path":"lean/formalization.yaml","authorization_relationship":"maintainer"}
